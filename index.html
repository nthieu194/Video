    <script>
      // Prevent global ReferenceError for EmptyRanges in headless WebKit/automated running environments
      if (typeof window !== 'undefined' && !('EmptyRanges' in window)) {
        window.EmptyRanges = class EmptyRanges {
          constructor() {
            this.length = 0;
          }
          [Symbol.iterator]() {
            return {
              next() {
                return { value: undefined, done: true };
              }
            };
          }
        };
      }
      if (typeof window !== 'undefined') {
        var EmptyRanges = window.EmptyRanges;
      }

      // Register PWA Service Worker
      if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => {
              console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
            },
            (err) => {
              console.warn('[PWA] ServiceWorker registration failed:', err);
            }
          );
        });
      }
    </script>
